openapi: 3.1.0

info:
  title: LemiCraft API
  description: |
    Публичное read-only API сайта [lemicraft.ru](https://lemicraft.ru).

    Базовый URL: `https://lemicraft.ru/api`.

    ## Авторизация

    Большинство эндпоинтов требуют **API ключ**, который игрок может сгенерировать
    в [настройках аккаунта](https://lemicraft.ru/settings).

    Передавай ключ в заголовке:
    ```
    Authorization: Bearer <ваш_ключ>
    ```

    Без ключа доступны только эндпоинты раздела **Лаунчер** (лимит: 60 запросов/мин по IP).
    С ключом доступны все эндпоинты (лимит: 300 запросов/мин по ключу).

    > Эндпоинты авторизации, тикетов, заявок на вайтлист и внутренних прокси в данный
    > справочник не включены.
  version: "1.0"
  contact:
    url: https://lemicraft.ru

servers:
  - url: https://lemicraft.ru/api
    description: Production

security:
  - ApiKey: []

tags:
  - name: Игроки
    description: Whitelist-игроки, профили, скины, статистика
  - name: Лаунчер
    description: Версии лаунчера и модпака, новости для лаунчера
  - name: Контент
    description: Новости сайта, галерея, лента постов
  - name: Сообщество
    description: Петиции и суд сервера

paths:

  # ── Игроки ──────────────────────────────────────────────────────────────────

  /players:
    get:
      tags: [Игроки]
      summary: Список игроков
      description: |
        Все игроки из whitelist-а с базовой информацией. Поддерживает поиск по нику.
      parameters:
        - name: search
          in: query
          description: Частичное совпадение по нику (регистронезависимо)
          required: false
          schema:
            type: string
            example: Steve
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  players:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerShort"
                  total:
                    type: integer
                    description: Количество игроков в ответе
                    example: 42
              example:
                players:
                  - name: Steve
                    uuid: 069a79f4-44e9-4726-a5be-fca90e38aaf5
                    serviceId: 0
                    banned: false
                total: 1

  /players/{nick}:
    get:
      tags: [Игроки]
      summary: Профиль игрока
      description: Подробная информация об игроке — UUID, статус бана, ссылки на аватар и скин.
      parameters:
        - $ref: "#/components/parameters/Nick"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerFull"
              example:
                name: Steve
                uuid: 069a79f4-44e9-4726-a5be-fca90e38aaf5
                serviceId: 0
                banned: false
                banReason: null
                banPermanent: false
                banEndsAt: null
                avatarUrl: /api/avatar/Steve
                skinUrl: /api/skin/Steve
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /avatar/{nick}:
    get:
      tags: [Игроки]
      summary: Аватар игрока
      description: |
        PNG-изображение головы игрока, **128×128 px**.

        Источник скина (в порядке приоритета): кастомный скин из БД → Mojang → Ely.by → Steve (по умолчанию).

        Кэшируется на 30 минут (`Cache-Control: public, max-age=1800`).
      parameters:
        - $ref: "#/components/parameters/Nick"
      responses:
        "200":
          description: PNG изображение
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=1800
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"

  /skin/{nick}:
    get:
      tags: [Игроки]
      summary: Скин игрока
      description: |
        Полная текстура скина **64×64 px** в формате PNG — подходит для skinview3d и других 3D-рендереров.

        Источник скина (в порядке приоритета): кастомный скин из БД → Mojang → Ely.by → Steve (по умолчанию).

        Кэшируется на 1 час (`Cache-Control: public, max-age=3600`).
      parameters:
        - $ref: "#/components/parameters/Nick"
      responses:
        "200":
          description: PNG текстура скина
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=3600
          content:
            image/png:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"

  /plan/{nick}:
    get:
      tags: [Игроки]
      summary: Статистика игрока
      description: |
        Статистика из плагина [Plan](https://stats.lemicraft.ru) — время онлайн, сессии, убийства и т.д.

        Данные берутся с `stats.lemicraft.ru` и могут отсутствовать для неактивных игроков.
      parameters:
        - $ref: "#/components/parameters/Nick"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerPlan"
              example:
                registered: "2024-03-01T12:00:00.000Z"
                lastSeen: "2025-01-10T18:30:00.000Z"
                online: false
                playtime: 3600000
                activePlaytime: 2700000
                playtimeStr: "1 ч 0 мин"
                sessions: 12
                longestSession: 7200000
                deaths: 7
                mobKills: 150
                playerKills: 0
                ping: 42.5
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Plan API недоступен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Plan не настроен на сервере
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ── Лаунчер ─────────────────────────────────────────────────────────────────

  /launcher/version:
    get:
      tags: [Лаунчер]
      security: []
      summary: Версия лаунчера
      description: Последний релиз лаунчера с GitHub. Кэшируется на 10 минут.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LauncherVersion"
              example:
                version: "1.4.2"
                downloadUrl: https://github.com/KOTOKOPOLb/lemicraft/releases/download/v1.4.2/LemiCraft-1.4.2.exe
                fileName: LemiCraft-1.4.2.exe
                fileSize: 52428800
                releaseDate: "2025-01-15T12:00:00Z"
        "503":
          description: GitHub репозиторий лаунчера не настроен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /launcher/modpack/version:
    get:
      tags: [Лаунчер]
      security: []
      summary: Версия модпака
      description: Последняя версия модпака LemiSborka с прямой ссылкой на скачивание.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModpackVersion"
              example:
                success: true
                version: "1.2.3"
                fileName: LemiSborka-1.2.3.zip
                downloadUrl: https://lemicraft.ru/mods/LemiSborka-1.2.3.zip
                fileSize: 314572800
                name: LemiSborka 1.2.3

  /launcher/news:
    get:
      tags: [Лаунчер]
      security: []
      summary: Новости для лаунчера
      description: |
        Новости из Discord-канала в упрощённом формате, адаптированном для отображения в лаунчере.

        Поддерживает фильтрацию по категории и ограничение количества.
      parameters:
        - name: limit
          in: query
          description: Количество новостей (максимум 50)
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
            example: 10
        - name: category
          in: query
          description: Фильтр по категории
          required: false
          schema:
            type: string
            enum: [general, update, event, maintenance, announcement]
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LauncherNewsItem"
                  total:
                    type: integer
                    example: 10

  # ── Контент ─────────────────────────────────────────────────────────────────

  /news:
    get:
      tags: [Контент]
      summary: Новости сайта
      description: |
        Новости из Discord-канала с полным HTML-рендером (markdown, спойлеры, упоминания, бейджи соцсетей).

        **Курсорная пагинация:** передай значение `lastId` из предыдущего ответа в параметр `before`.
      parameters:
        - name: before
          in: query
          description: Discord Snowflake ID — загрузить новости старее указанного сообщения
          required: false
          schema:
            type: string
            example: "1234567890123456789"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SiteNewsItem"
                  hasMore:
                    type: boolean
                    description: Есть ли следующая страница
                    example: true
                  lastId:
                    type: string
                    nullable: true
                    description: Передай в `before` для следующей страницы
                    example: "1234567890123456789"
                  stale:
                    type: boolean
                    description: "`true` если Discord недоступен и вернулись кэшированные данные"
                    example: false

  /gallery:
    get:
      tags: [Контент]
      summary: Галерея
      description: Список одобренных скриншотов из галереи сервера.
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  images:
                    type: array
                    items:
                      $ref: "#/components/schemas/GalleryImage"

  /posts:
    get:
      tags: [Контент]
      summary: Лента постов
      description: |
        Посты игроков с медиафайлами, голосами и превью комментариев.

        **Курсорная пагинация:** передай `lastId` из предыдущего ответа в параметр `before`.

        Поле `userVote` всегда `null` без авторизации.
      parameters:
        - name: before
          in: query
          description: ID поста — загрузить посты старее указанного
          required: false
          schema:
            type: integer
            example: 100
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  hasMore:
                    type: boolean
                    example: true
                  lastId:
                    type: integer
                    nullable: true
                    description: Передай в `before` для следующей страницы
                    example: 80

  /posts/{id}:
    get:
      tags: [Контент]
      summary: Пост по ID
      description: Один пост со **всеми** комментариями (в `/posts` возвращается только превью из 3 комментариев).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 42
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Сообщество ───────────────────────────────────────────────────────────────

  /petitions:
    get:
      tags: [Сообщество]
      summary: Список петиций
      description: |
        Публичные петиции сервера. По умолчанию возвращает только активные.

        Поле `userVote` всегда `null` без авторизации.
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу
          required: false
          schema:
            type: string
            enum: [active, closed, blocked]
            default: active
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  petitions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Petition"

  /court:
    get:
      tags: [Сообщество]
      summary: Список дел суда
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу
          required: false
          schema:
            type: string
            enum: [open, closed]
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  cases:
                    type: array
                    items:
                      $ref: "#/components/schemas/CourtCase"

  /court/{id}:
    get:
      tags: [Сообщество]
      summary: Дело суда по ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  case:
                    $ref: "#/components/schemas/CourtCase"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /court/messages/{id}:
    get:
      tags: [Сообщество]
      summary: Сообщения по делу
      description: Все сообщения (аргументы сторон) в рамках судебного дела.
      parameters:
        - name: id
          in: path
          required: true
          description: ID дела
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: "#/components/schemas/CourtMessage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

# ── Компоненты ────────────────────────────────────────────────────────────────

components:

  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: API ключ из настроек аккаунта на lemicraft.ru/settings

  parameters:
    Nick:
      name: nick
      in: path
      required: true
      description: Игровой ник
      schema:
        type: string
        example: Notch

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            statusCode: 400
            message: Ник обязателен
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            statusCode: 404
            message: Игрок не найден

  schemas:

    Error:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: Не найдено

    PlayerShort:
      type: object
      properties:
        name:
          type: string
          description: Игровой ник
          example: Notch
        uuid:
          type: string
          nullable: true
          description: UUID игрока (hex без дефисов)
          example: 069a79f444e94726a5befca90e38aaf5
        serviceId:
          type: integer
          description: Сервис авторизации — `0` Mojang, `1` Ely.by
          enum: [0, 1]
          example: 0
        banned:
          type: boolean
          description: Забанен ли игрок
          example: false

    PlayerFull:
      allOf:
        - $ref: "#/components/schemas/PlayerShort"
        - type: object
          properties:
            avatarUrl:
              type: string
              description: Путь к аватару (голова 128×128)
              example: /api/avatar/Notch
            skinUrl:
              type: string
              description: Путь к текстуре скина (64×64)
              example: /api/skin/Notch
            banReason:
              type: string
              nullable: true
              description: Причина бана
              example: Читы
            banPermanent:
              type: boolean
              description: Перманентный бан
              example: false
            banEndsAt:
              type: string
              nullable: true
              format: date-time
              description: Дата окончания бана (`null` если перманентный или не забанен)

    PlayerPlan:
      type: object
      properties:
        registered:
          type: string
          nullable: true
          format: date-time
          description: Дата первого входа на сервер
        lastSeen:
          type: string
          nullable: true
          format: date-time
          description: Дата последнего визита
        online:
          type: boolean
          description: Онлайн ли прямо сейчас
          example: false
        playtime:
          type: integer
          nullable: true
          description: Общее время игры в миллисекундах
          example: 3600000
        activePlaytime:
          type: integer
          nullable: true
          description: Активное время (без AFK) в миллисекундах
          example: 2700000
        playtimeStr:
          type: string
          description: Время игры в читаемом формате
          example: "1 ч 0 мин"
        sessions:
          type: integer
          nullable: true
          description: Количество игровых сессий
          example: 12
        longestSession:
          type: integer
          nullable: true
          description: Самая долгая сессия в миллисекундах
          example: 7200000
        deaths:
          type: integer
          nullable: true
          description: Количество смертей
          example: 7
        mobKills:
          type: integer
          nullable: true
          description: Убийств мобов
          example: 150
        playerKills:
          type: integer
          nullable: true
          description: Убийств игроков
          example: 0
        ping:
          type: number
          nullable: true
          description: Средний пинг в мс
          example: 42.5

    LauncherVersion:
      type: object
      properties:
        version:
          type: string
          description: Версия без префикса `v`
          example: "1.4.2"
        downloadUrl:
          type: string
          description: Прямая ссылка на скачивание `.exe`
          example: https://github.com/KOTOKOPOLb/lemicraft/releases/download/v1.4.2/LemiCraft-1.4.2.exe
        fileName:
          type: string
          example: LemiCraft-1.4.2.exe
        fileSize:
          type: integer
          description: Размер файла в байтах
          example: 52428800
        releaseDate:
          type: string
          format: date-time
          description: Дата релиза
          example: "2025-01-15T12:00:00Z"

    ModpackVersion:
      type: object
      properties:
        success:
          type: boolean
          example: true
        version:
          type: string
          example: "1.2.3"
        fileName:
          type: string
          example: LemiSborka-1.2.3.zip
        downloadUrl:
          type: string
          description: Прямая ссылка на скачивание архива модпака
          example: https://lemicraft.ru/mods/LemiSborka-1.2.3.zip
        fileSize:
          type: integer
          description: Размер файла в байтах
          example: 314572800
        name:
          type: string
          example: LemiSborka 1.2.3

    LauncherNewsItem:
      type: object
      properties:
        id:
          type: string
          description: Discord Snowflake ID сообщения
          example: "1234567890123456789"
        title:
          type: string
          example: Обновление сервера 1.2
        preview:
          type: string
          description: Короткий текст до 200 символов
          example: Вышло новое обновление сервера...
        content:
          type: string
          description: Полный текст новости (markdown)
        imageUrl:
          type: string
          nullable: true
          description: Изображение из вложения или embed
        authorName:
          type: string
          example: Admin
        authorRole:
          type: string
          example: Администратор
        authorAvatarUrl:
          type: string
          description: Аватар Discord
        publishedAt:
          type: string
          format: date-time
        category:
          type: string
          enum: [general, update, event, maintenance, announcement]
          example: update
        url:
          type: string
          description: Ссылка на сообщение в Discord

    SiteNewsItem:
      type: object
      properties:
        id:
          type: string
          description: Discord Snowflake ID сообщения
          example: "1234567890123456789"
        html:
          type: string
          description: |
            HTML-контент с обработанными упоминаниями, markdown, спойлерами и цветными бейджами
            для ссылок на Discord/Telegram/Twitch/YouTube.
        images:
          type: array
          description: Изображения из вложений и embed-ов (проксированные URL)
          items:
            type: string
        authorName:
          type: string
          example: Admin
        authorRole:
          type: string
          example: Администратор
        authorAvatarUrl:
          type: string
          nullable: true
          description: Аватар Discord (проксированный URL)
        publishedAt:
          type: string
          format: date-time
        url:
          type: string
          description: Ссылка на оригинальное сообщение в Discord

    GalleryImage:
      type: object
      properties:
        id:
          type: integer
          example: 1
        url:
          type: string
          description: Относительный путь к файлу
          example: /uploads/gallery/screenshot.png
        filename:
          type: string
          example: screenshot.png

    Comment:
      type: object
      properties:
        id:
          type: integer
          example: 10
        authorDiscordId:
          type: string
          example: "123456789012345678"
        authorName:
          type: string
          example: Steve
        text:
          type: string
          example: Отличный пост!
        createdAt:
          type: string
          format: date-time

    Post:
      type: object
      properties:
        id:
          type: integer
          example: 42
        authorDiscordId:
          type: string
          example: "123456789012345678"
        authorName:
